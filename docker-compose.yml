version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# SG Internship Aggregator – Docker Compose
#
# Usage:
#   docker-compose up --build        # first run (builds image)
#   docker-compose up -d             # subsequent runs (background)
#   docker-compose logs -f           # tail logs
#   docker-compose down              # stop and remove containers
#   docker-compose down -v           # also remove named volumes
# ──────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sg-internship-app:latest
    container_name: sg_internship
    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    environment:
      HOST:                   "0.0.0.0"
      PORT:                   "${PORT:-8000}"
      DB_PATH:                "/app/data/jobs.db"
      LOG_FILE:               "/app/logs/scraper.log"
      LOG_LEVEL:              "${LOG_LEVEL:-INFO}"
      SCRAPE_INTERVAL_HOURS:  "${SCRAPE_INTERVAL_HOURS:-6}"
      REQUEST_DELAY_MIN:      "${REQUEST_DELAY_MIN:-2}"
      REQUEST_DELAY_MAX:      "${REQUEST_DELAY_MAX:-5}"

    volumes:
      # Persist SQLite database across container restarts
      - db_data:/app/data
      # Persist logs across restarts
      - log_data:/app/logs

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout:  10s
      retries:   5
      start_period: 90s   # allow time for first scrape to start

    # Resource limits – be respectful, don't hammer CPUs for scraping
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "1G"
        reservations:
          memory: "256M"

volumes:
  db_data:
    driver: local
  log_data:
    driver: local
